services:
  ##### Twig Extension
  Austral\ToolsBundle\TwigExtension\ToolsTwig:
    arguments:    ["%kernel.project_dir%"]
  twig.extension.tools:
    alias:        Austral\ToolsBundle\TwigExtension\ToolsTwig

  ##### Debug
  Austral\ToolsBundle\Services\Debug:
    calls:
      - [ setDebugStopWatch, ['@?debug.stopwatch'] ]
  austral.tools.debug:
    alias:        Austral\ToolsBundle\Services\Debug

  ##### Service Status checker
  Austral\ToolsBundle\Services\ServicesStatusChecker:
    arguments:
      - '@service_container'
      - '%kernel.project_dir%'
      - '%austral.tools.services%'
  austral.tools.status-checker:
    alias:        Austral\ToolsBundle\Services\ServicesStatusChecker
