services:

  ##### Command Status checker
  austral.tools.status-checker.command:
    class: Austral\ToolsBundle\Command\StatusCheckerCommand
    arguments:
      $servicesStatusChecker: '@austral.tools.status-checker'
    calls:
      - [ setEventDispatcher, [ '@event_dispatcher' ] ]
    tags:
      - { name: console.command, command: 'austral:tools:status-checker' }
